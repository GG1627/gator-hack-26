<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="704" viewBox="0 0 1200 704" role="img" aria-labelledby="title desc">
  <title id="title">Peekaboo architecture and information boundaries</title>
  <desc id="desc">CPU acquisition reads only acquired images, fits Gaussian shapes and schedules the next image. Gaussian parameters also go to a native cuTile Rust GPU renderer. Withheld frames and event labels enter a separate offline evaluator, never the controller. The browser replays exported images, decisions and metrics.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#b7bbb8" stroke-width="1.7"/></marker>
    <style>text{font-family:Arial,Helvetica,sans-serif}.label{font-size:17px;letter-spacing:1.7px;font-weight:700}.title{font-size:25px;font-weight:700;fill:#f5f1e7}.sub{font-size:18px;fill:#b7bbb8}.box{fill:#2d3033;stroke:#565b60;stroke-width:1}.arrow{fill:none;stroke:#b7bbb8;stroke-width:1.6;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="704" rx="18" fill="#242629"/>
  <text x="48" y="52" fill="#f6d48b" class="label">ACQUIRE ONLY WHAT THE CONTROLLER CHOOSES</text>
  <text x="48" y="85" class="sub">No future images or division labels enter an acquisition decision.</text>
  <text x="48" y="130" fill="#7da5c3" class="label">01 / CPU · ACQUISITION LOOP</text>
  <rect x="48" y="151" width="300" height="100" rx="10" class="box"/>
  <text x="70" y="191" class="title">Acquired image</text><text x="70" y="221" class="sub">Past observations only</text>
  <path d="M354 201H437" class="arrow"/>
  <rect x="450" y="151" width="300" height="100" rx="10" class="box"/>
  <text x="472" y="191" class="title">Gaussian shape fit</text><text x="472" y="221" class="sub">Position · brightness · shape</text>
  <path d="M756 201H839" class="arrow"/>
  <rect x="852" y="151" width="300" height="100" rx="10" fill="#403a2d" stroke="#e9b669"/>
  <text x="874" y="191" class="title">Choose next capture</text><text x="874" y="221" class="sub">Shape cue + budget + gap limits</text>
  <path d="M1002 257V287H198V257" class="arrow"/>
  <text x="507" y="280" class="sub" fill="#f6d48b">Wait, then acquire</text>
  <text x="48" y="340" fill="#e9b669" class="label">02 / GPU · MODEL RENDERING</text>
  <rect x="48" y="361" width="300" height="100" rx="10" class="box"/>
  <text x="70" y="401" class="title">Gaussian parameters</text><text x="70" y="431" class="sub">Validated descriptors</text>
  <path d="M354 411H437" class="arrow"/>
  <rect x="450" y="361" width="300" height="100" rx="10" class="box"/>
  <text x="472" y="401" class="title">Native cuTile Rust kernel</text><text x="472" y="431" class="sub">128 output positions per tile</text>
  <path d="M756 411H839" class="arrow"/>
  <rect x="852" y="361" width="300" height="100" rx="10" class="box"/>
  <text x="874" y="401" class="title">Rendered model image</text><text x="874" y="431" class="sub">Checked against CPU reference</text>
  <text x="48" y="500" class="sub">The GPU renders model imagery. Capture scheduling and fitting stay on the CPU.</text>
  <path d="M48 528H1152" stroke="#565b60" stroke-dasharray="5 7"/>
  <text x="48" y="566" fill="#b7bbb8" class="label">03 / EVALUATION · AFTER THE RUN CLOSES</text>
  <text x="48" y="605" class="title">Withheld frames + labels</text>
  <path d="M367 598H437" class="arrow"/>
  <text x="472" y="605" class="title">Offline evaluator</text>
  <path d="M756 598H839" class="arrow"/>
  <text x="874" y="605" class="title">Coverage + image error</text>
  <text x="48" y="663" class="sub">Browser: replay exported acquisitions, model images, schedules and evaluation results.</text>
</svg>
